<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/namorar.css">
    <title>Quer?</title>

    <script defer>
        document.addEventListener('DOMContentLoaded', () => {

        
        const botoes = document.querySelectorAll('button');
        const h1 = document.querySelector('h1')
        
        let state = 0;
        botoes[0].addEventListener('click', handleClick);
        botoes[1].addEventListener('click', handleClickNao);

        function handleClick() {
            if (state == 0 ) {
                h1.innerText = 'Quer namorar comigo?'
                state++
                return;
            }
            h1.innerText = ':DDDD';

            setTimeout(() => {
                window.location.href = 'index.html'
            }, 1200)
        };

        function handleClickNao() {
            if (state == 0 ) {
                h1.innerText = 'Quer namorar comigo?'
                state++
                return;
            }
            h1.innerText = 'AFF';
            setTimeout(() => {
                window.location.href = 'index.html'
            }, 2000)
        };

    })
    </script>
</head>
<body>

    <h1>Quer o joguinho de bolas infinito?</h1>

    <div>
        <button class="sim">Sim</button><button class="nao">Não</button>
    </div>
</body>
</html>
